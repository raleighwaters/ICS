services:
  ics_node_1:
    image: icsd:local
    container_name: node1
    hostname: node1
    ports:
      - "5001:5000"
    volumes:
      - ./config_cluster1.yaml:/etc/ics/config.yaml
      - ./script:/app/script
      - ./examples:/app/examples
    networks:
      - ics_network

  ics_node_2:
    image: icsd:local
    container_name: node2
    hostname: node2
    ports:
      - "5002:5000"
    volumes:
      - ./config_cluster1.yaml:/etc/ics/config.yaml
      - ./script:/app/script
      - ./examples:/app/examples
    networks:
      - ics_network

  ics_node_3:
    image: icsd:local
    container_name: node3
    hostname: node3
    ports:
      - "5003:5000"
    volumes:
      - ./config_cluster1.yaml:/etc/ics/config.yaml
      - ./script:/app/script
      - ./examples:/app/examples
    networks:
      - ics_network

networks:
  ics_network:
    driver: bridge
