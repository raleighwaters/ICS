services:

  ics_node_1:
    image: icsd:local
    container_name: node1
    hostname: node1
    ports:
      - "5001:5000"
    volumes:
      - ./config1.yaml:/etc/ics/config.yaml
    networks:
      - ics_network

  ics_node_2:
    image: icsd:local
    container_name: node2
    hostname: node2
    ports:
      - "5002:5000"
    volumes:
      - ./config2.yaml:/etc/ics/config.yaml
    networks:
      - ics_network

  ics_node_3:
    image: icsd:local
    container_name: node3
    hostname: node3
    ports:
      - "5003:5000"
    volumes:
      - ./config3.yaml:/etc/ics/config.yaml
    networks:
      - ics_network


networks:
  ics_network:
