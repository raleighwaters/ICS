version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

#  file:
#    class: logging.handlers.RotatingFileHandler
#    level: DEBUG
#    formatter: standard
#    filename: /var/log/ics/icsd.log
#    maxBytes: 10485760  # 10MB
#    backupCount: 5

loggers:
  ics:
    level: DEBUG
    handlers: [console]
    propagate: no

  uvicorn:
    level: INFO
    handlers: [console]
    propagate: no

  Pyro4:
    level: WARNING
    handlers: [console]
    propagate: no

root:
  level: DEBUG
  handlers: [console]
